name: Build APK v3 (nav preserved)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # NODE.JS
      # ============================================================
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # ============================================================
      # INSTALL DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: npm install


      # ============================================================
      # PREPARE STATIC WEBSITE
      # ============================================================
      - name: Prepare web assets
        run: |
          rm -rf www
          mkdir -p www

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='android/' \
            --exclude='ios/' \
            --exclude='node_modules/' \
            --exclude='www/' \
            --exclude='assets-icon/' \
            --exclude='capacitor.config.*' \
            --exclude='logo.png' \
            --exclude='Build-app.yml' \
            ./ www/

          echo "=========================================="
          echo "Website files copied to www/"
          echo "=========================================="

          find www -type f | sort


          # --------------------------------------------------------
          # Capacitor download bridge
          # --------------------------------------------------------
          cat > www/capacitor-download-bridge.js << 'SCRIPT_EOF'
          (function () {
            if (window.__downloadBridgeInstalled) return;
            window.__downloadBridgeInstalled = true;

            var nativeBridge = window.AndroidDownloadBridge || null;
            var Filesystem = (window.Capacitor && window.Capacitor.Plugins &&
                              window.Capacitor.Plugins.Filesystem) || null;

            if (!nativeBridge && !Filesystem) {
              console.warn('Download bridge: no saving backend available');
              return;
            }

            // Must be a multiple of 3 so each chunk is valid standalone base64.
            var CHUNK_SIZE = 3 * 256 * 1024;

            var MIME_EXT = {
              'video/mp4': 'mp4', 'video/webm': 'webm', 'video/quicktime': 'mov',
              'audio/mpeg': 'mp3', 'audio/mp4': 'm4a', 'audio/ogg': 'ogg',
              'audio/wav': 'wav', 'audio/webm': 'weba',
              'image/png': 'png', 'image/jpeg': 'jpg', 'image/gif': 'gif',
              'image/webp': 'webp', 'image/svg+xml': 'svg',
              'application/pdf': 'pdf', 'application/zip': 'zip',
              'application/json': 'json', 'text/plain': 'txt',
              'text/csv': 'csv', 'text/html': 'html'
            };


            // ----------------------------------------------------------
            // Blob registry: lets us read a blob even if the page already
            // revoked its URL right after triggering the download.
            // ----------------------------------------------------------
            var blobRegistry = new Map();

            var origCreateObjectURL = URL.createObjectURL;
            URL.createObjectURL = function (obj) {
              var url = origCreateObjectURL.apply(URL, arguments);
              if (typeof Blob !== 'undefined' && obj instanceof Blob) {
                blobRegistry.set(url, obj);
              }
              return url;
            };

            var origRevokeObjectURL = URL.revokeObjectURL;
            URL.revokeObjectURL = function (url) {
              setTimeout(function () { blobRegistry.delete(url); }, 60000);
              return origRevokeObjectURL.apply(URL, arguments);
            };

            function getBlob(url) {
              var known = blobRegistry.get(url);
              if (known) return Promise.resolve(known);

              return fetch(url).then(function (response) {
                if (!response.ok) throw new Error('HTTP ' + response.status);
                return response.blob();
              });
            }


            // ----------------------------------------------------------
            // File name helpers
            // ----------------------------------------------------------
            function nameFromUrl(url) {
              try {
                var u = new URL(url, location.href);
                if (u.protocol === 'http:' || u.protocol === 'https:') {
                  return decodeURIComponent(u.pathname.split('/').pop() || '');
                }
              } catch (e) {}
              return '';
            }

            function finalName(name, mime) {
              name = (name || '').trim() || ('download-' + Date.now());
              if (!/\.[A-Za-z0-9]{1,8}$/.test(name)) {
                var ext = MIME_EXT[(mime || '').split(';')[0].toLowerCase()];
                if (ext) name += '.' + ext;
              }
              return name;
            }


            // ----------------------------------------------------------
            // Saving
            // ----------------------------------------------------------
            function readChunk(blob) {
              return new Promise(function (resolve, reject) {
                var reader = new FileReader();
                reader.onload = function () {
                  var s = reader.result;
                  resolve(s.slice(s.indexOf(',') + 1));
                };
                reader.onerror = function () { reject(reader.error); };
                reader.readAsDataURL(blob);
              });
            }

            async function saveViaNative(blob, filename) {
              var id = nativeBridge.beginSave(filename, blob.type || 'application/octet-stream');
              if (!id) return false;

              try {
                for (var off = 0; off < blob.size; off += CHUNK_SIZE) {
                  var b64 = await readChunk(blob.slice(off, off + CHUNK_SIZE));
                  if (!nativeBridge.appendChunk(id, b64)) throw new Error('Write failed');
                }
                return nativeBridge.finishSave(id);
              } catch (e) {
                nativeBridge.abortSave(id);
                throw e;
              }
            }

            async function saveViaFilesystem(blob, filename) {
              var b64 = await readChunk(blob);
              await Filesystem.writeFile({
                path: 'Download/' + filename,
                data: b64,
                directory: 'DOCUMENTS',
                recursive: true
              });
              alert('Saved to Documents/Download: ' + filename);
            }

            async function saveBlob(blob, filename) {
              filename = finalName(filename, blob.type);

              if (nativeBridge && await saveViaNative(blob, filename)) return;
              if (Filesystem) return saveViaFilesystem(blob, filename);
              throw new Error('Could not save file');
            }

            function report(error) {
              console.error('Download failed:', error);
              var msg = 'Download failed: ' + (error && error.message ? error.message : error);
              if (nativeBridge && nativeBridge.toast) nativeBridge.toast(msg);
              else alert(msg);
            }

            function saveUrl(url, filename) {
              getBlob(url)
                .then(function (blob) { return saveBlob(blob, filename); })
                .catch(report);
            }


            // ----------------------------------------------------------
            // Called by the native DownloadListener for blob:, data: and
            // same-origin downloads (anything WebView decided to download
            // on its own: video "Download" button, Content-Disposition
            // responses, form posts, window.open, location changes...).
            // ----------------------------------------------------------
            window.__bridgeDownloadUrl = function (url, hint, mime) {
              getBlob(url)
                .then(function (blob) {
                  if (!blob.type && mime) blob = blob.slice(0, blob.size, mime);
                  var name = hint || nameFromUrl(url);
                  return saveBlob(blob, name);
                })
                .catch(report);
            };


            // ----------------------------------------------------------
            // Anchor handling (<a download>), real taps and synthetic ones
            // ----------------------------------------------------------
            function handleAnchor(a) {
              if (!a || !a.hasAttribute || !a.hasAttribute('download')) return false;

              var href = a.href;
              if (!href) return false;

              var name = a.getAttribute('download') || '';

              if (/^(blob:|data:)/i.test(href)) {
                saveUrl(href, name);
                return true;
              }

              var u;
              try { u = new URL(href, location.href); } catch (e) { return false; }

              if (u.origin === location.origin) {
                saveUrl(href, name || nameFromUrl(href));
                return true;
              }

              // Cross-origin: WebView ignores the download attribute and would
              // navigate away, so hand the URL to the native DownloadManager.
              if (/^https?:$/.test(u.protocol) && nativeBridge && nativeBridge.downloadUrl) {
                nativeBridge.downloadUrl(href, name || nameFromUrl(href), '');
                return true;
              }

              return false;
            }

            // a.click() on detached or attached anchors
            var origAnchorClick = HTMLAnchorElement.prototype.click;
            HTMLAnchorElement.prototype.click = function () {
              if (handleAnchor(this)) return;
              return origAnchorClick.apply(this, arguments);
            };

            // a.dispatchEvent(new MouseEvent('click')) (FileSaver.js style)
            var origDispatchEvent = EventTarget.prototype.dispatchEvent;
            EventTarget.prototype.dispatchEvent = function (event) {
              if (
                event && event.type === 'click' &&
                this instanceof HTMLAnchorElement &&
                handleAnchor(this)
              ) {
                return true;
              }
              return origDispatchEvent.apply(this, arguments);
            };

            // Real user taps on <a download> (including inside shadow DOM)
            document.addEventListener('click', function (event) {
              if (event.defaultPrevented) return;

              var a = null;
              var path = event.composedPath ? event.composedPath() : [];

              for (var i = 0; i < path.length; i++) {
                if (path[i] instanceof HTMLAnchorElement) { a = path[i]; break; }
              }

              if (!a && event.target && event.target.closest) {
                a = event.target.closest('a');
              }

              if (a && handleAnchor(a)) event.preventDefault();
            }, true);
          })();
          SCRIPT_EOF


      # ============================================================
      # ADD ANDROID PLATFORM
      # ============================================================
      - name: Add Android platform
        run: npx cap add android


      # ============================================================
      # SET APP VERSION FROM package.json
      # ============================================================
      - name: Set app version from package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION%%-*}"
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))

          sed -i -E "s/versionCode [0-9]+/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle

          echo "versionName=$VERSION versionCode=$VERSION_CODE"
          grep -E "versionCode|versionName" android/app/build.gradle


      # ============================================================
      # DYNAMIC COLOR
      # Material You / Android 12+
      # ============================================================
      - name: Inject dynamic color bridge
        run: |

          # --------------------------------------------------------
          # 1. Add Material Components dependency
          # --------------------------------------------------------
          GRADLE_FILE=android/app/build.gradle

          if [ ! -f "$GRADLE_FILE" ]; then
            echo "ERROR: $GRADLE_FILE not found."
            exit 1
          fi

          if ! grep -q "com.google.android.material:material" "$GRADLE_FILE"; then
            sed -i \
              "s#implementation project(':capacitor-android')#implementation project(':capacitor-android')\n    implementation 'com.google.android.material:material:1.12.0'#" \
              "$GRADLE_FILE"

            echo "Added Material Components dependency."
          else
            echo "Material Components dependency already present."
          fi


          # --------------------------------------------------------
          # 3. Patch MainActivity.java
          # --------------------------------------------------------
          MAIN_ACTIVITY=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "ERROR: MainActivity.java not found."
            exit 1
          fi

          PACKAGE_LINE=$(grep '^package ' "$MAIN_ACTIVITY")

          cat > "$MAIN_ACTIVITY" << JAVA_EOF
          $PACKAGE_LINE

          import android.content.Context;
          import android.os.Bundle;
          import android.view.ContextThemeWrapper;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;

          import android.app.DownloadManager;
          import android.content.ContentValues;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.webkit.CookieManager;
          import android.webkit.URLUtil;
          import android.widget.Toast;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;
          import java.util.HashMap;
          import java.util.Map;
          import java.util.UUID;
          import org.json.JSONObject;

          import com.getcapacitor.BridgeActivity;
          import com.google.android.material.color.DynamicColors;
          import com.google.android.material.color.MaterialColors;
          import com.google.android.material.R;

          public class MainActivity extends BridgeActivity {
              private Context dynamicColorContext;


              @Override
              public void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  Context materialContext =
                      new ContextThemeWrapper(
                          this,
                          R.style.Theme_Material3_DayNight_NoActionBar
                      );

                  /*
                   * Apply Android 12+ dynamic colors ONLY to this
                   * temporary palette context.
                   */
                  dynamicColorContext =
                      DynamicColors.wrapContextIfAvailable(
                          materialContext
                      );


                  /*
                   * Expose the resolved Material palette to JavaScript.
                   */
                  WebView webView = bridge.getWebView();

                  webView.addJavascriptInterface(
                      new DynamicColorJavascriptInterface(),
                      "DynamicColorBridge"
                  );
                  webView.setVerticalScrollBarEnabled(false);

                  webViewUserAgent = webView.getSettings().getUserAgentString();

                  webView.addJavascriptInterface(
                      new DownloadJavascriptInterface(),
                      "AndroidDownloadBridge"
                  );

                  webView.setDownloadListener(
                      (url, userAgent, contentDisposition, mimetype, contentLength) ->
                          handleDownloadStart(url, userAgent, contentDisposition, mimetype)
                  );
              }


              /* ============================================================
               * DOWNLOAD SUPPORT
               * ============================================================ */

              private String webViewUserAgent;

              private static class PendingFile {
                  OutputStream out;
                  Uri uri;
                  File file;
                  String name;
              }

              private final Map<String, PendingFile> pendingFiles = new HashMap<>();


              private void toast(final String message) {
                  runOnUiThread(() ->
                      Toast.makeText(MainActivity.this, message, Toast.LENGTH_SHORT).show()
                  );
              }


              private String sanitizeFileName(String name) {
                  if (name == null) name = "";
                  name = name.replaceAll("[/:*?<>|\"]", "_").trim();
                  while (name.startsWith(".")) name = name.substring(1);
                  if (name.isEmpty()) name = "download-" + System.currentTimeMillis();
                  return name;
              }


              private File uniqueFile(File dir, String name) {
                  File file = new File(dir, name);
                  if (!file.exists()) return file;

                  int dot = name.lastIndexOf('.');
                  String base = dot > 0 ? name.substring(0, dot) : name;
                  String ext = dot > 0 ? name.substring(dot) : "";

                  int i = 1;
                  while (file.exists()) {
                      file = new File(dir, base + " (" + i + ")" + ext);
                      i++;
                  }
                  return file;
              }


              private boolean isSameOrigin(String url) {
                  try {
                      String host = Uri.parse(url).getHost();
                      if (host == null) return false;
                      if ("localhost".equalsIgnoreCase(host)) return true;

                      String current = bridge.getWebView().getUrl();
                      return current != null
                          && host.equalsIgnoreCase(Uri.parse(current).getHost());
                  } catch (Exception e) {
                      return false;
                  }
              }


              /* Remote http(s) files: hand off to Android DownloadManager. */
              private void enqueueDownload(
                  String url,
                  String userAgent,
                  String contentDisposition,
                  String mimetype,
                  String filenameHint
              ) {
                  try {
                      String name = (filenameHint != null && !filenameHint.isEmpty())
                          ? filenameHint
                          : URLUtil.guessFileName(url, contentDisposition, mimetype);
                      name = sanitizeFileName(name);

                      DownloadManager.Request request =
                          new DownloadManager.Request(Uri.parse(url));

                      if (mimetype != null && !mimetype.isEmpty()) {
                          request.setMimeType(mimetype);
                      }

                      String cookie = CookieManager.getInstance().getCookie(url);
                      if (cookie != null) request.addRequestHeader("Cookie", cookie);

                      String ua = userAgent != null ? userAgent : webViewUserAgent;
                      if (ua != null) request.addRequestHeader("User-Agent", ua);

                      request.setNotificationVisibility(
                          DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED
                      );
                      request.setDestinationInExternalPublicDir(
                          Environment.DIRECTORY_DOWNLOADS,
                          name
                      );

                      DownloadManager dm =
                          (DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE);
                      dm.enqueue(request);

                      toast("Downloading: " + name);

                  } catch (Exception e) {
                      toast("Download failed: " + e.getMessage());
                  }
              }


              /*
               * Catch-all: WebView calls this for every navigation or media
               * action that turns into a download (buttons that set
               * location.href, form submits, window.open, video element
               * download button, Content-Disposition: attachment, ...).
               */
              private void handleDownloadStart(
                  String url,
                  String userAgent,
                  String contentDisposition,
                  String mimetype
              ) {
                  if (url == null) return;

                  boolean hasDisposition =
                      contentDisposition != null && !contentDisposition.isEmpty();

                  if (url.startsWith("blob:") || url.startsWith("data:") || isSameOrigin(url)) {

                      /* Only the page itself can read these, so let JS do it. */
                      String hint = "";
                      if (hasDisposition || (!url.startsWith("blob:") && !url.startsWith("data:"))) {
                          hint = URLUtil.guessFileName(url, contentDisposition, mimetype);
                      }

                      final String js =
                          "window.__bridgeDownloadUrl && window.__bridgeDownloadUrl("
                          + JSONObject.quote(url) + ","
                          + JSONObject.quote(hint) + ","
                          + JSONObject.quote(mimetype == null ? "" : mimetype)
                          + ");";

                      runOnUiThread(() -> bridge.getWebView().evaluateJavascript(js, null));

                  } else if (url.startsWith("http://") || url.startsWith("https://")) {

                      enqueueDownload(url, userAgent, contentDisposition, mimetype, null);

                  } else {
                      toast("Unsupported download link");
                  }
              }


              /* Chunked file writer + DownloadManager access for JavaScript. */
              private class DownloadJavascriptInterface {

                  @JavascriptInterface
                  public String beginSave(String filename, String mime) {
                      try {
                          String safeName = sanitizeFileName(filename);
                          if (mime == null || mime.isEmpty()) mime = "application/octet-stream";

                          PendingFile pf = new PendingFile();
                          pf.name = safeName;

                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {

                              ContentValues values = new ContentValues();
                              values.put(MediaStore.MediaColumns.DISPLAY_NAME, safeName);
                              values.put(MediaStore.MediaColumns.MIME_TYPE, mime);
                              values.put(
                                  MediaStore.MediaColumns.RELATIVE_PATH,
                                  Environment.DIRECTORY_DOWNLOADS
                              );
                              values.put(MediaStore.MediaColumns.IS_PENDING, 1);

                              Uri uri = getContentResolver().insert(
                                  MediaStore.Downloads.EXTERNAL_CONTENT_URI,
                                  values
                              );
                              if (uri == null) return null;

                              pf.uri = uri;
                              pf.out = getContentResolver().openOutputStream(uri);

                          } else {

                              File dir = Environment.getExternalStoragePublicDirectory(
                                  Environment.DIRECTORY_DOWNLOADS
                              );
                              File file;
                              OutputStream out;

                              try {
                                  if (!dir.exists()) dir.mkdirs();
                                  file = uniqueFile(dir, safeName);
                                  out = new FileOutputStream(file);
                              } catch (Exception e) {
                                  /* No storage permission: use app-specific folder. */
                                  dir = getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS);
                                  file = uniqueFile(dir, safeName);
                                  out = new FileOutputStream(file);
                              }

                              pf.file = file;
                              pf.out = out;
                          }

                          if (pf.out == null) return null;

                          String id = UUID.randomUUID().toString();
                          synchronized (pendingFiles) {
                              pendingFiles.put(id, pf);
                          }
                          return id;

                      } catch (Exception e) {
                          return null;
                      }
                  }


                  @JavascriptInterface
                  public boolean appendChunk(String id, String base64) {
                      PendingFile pf;
                      synchronized (pendingFiles) {
                          pf = pendingFiles.get(id);
                      }
                      if (pf == null) return false;

                      try {
                          pf.out.write(Base64.decode(base64, Base64.DEFAULT));
                          return true;
                      } catch (Exception e) {
                          return false;
                      }
                  }


                  @JavascriptInterface
                  public boolean finishSave(String id) {
                      PendingFile pf;
                      synchronized (pendingFiles) {
                          pf = pendingFiles.remove(id);
                      }
                      if (pf == null) return false;

                      try {
                          pf.out.flush();
                          pf.out.close();

                          if (pf.uri != null && Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              ContentValues values = new ContentValues();
                              values.put(MediaStore.MediaColumns.IS_PENDING, 0);
                              getContentResolver().update(pf.uri, values, null, null);
                          }

                          toast("Saved to Downloads: " + pf.name);
                          return true;

                      } catch (Exception e) {
                          toast("Failed to save file: " + e.getMessage());
                          return false;
                      }
                  }


                  @JavascriptInterface
                  public void abortSave(String id) {
                      PendingFile pf;
                      synchronized (pendingFiles) {
                          pf = pendingFiles.remove(id);
                      }
                      if (pf == null) return;

                      try { pf.out.close(); } catch (Exception ignored) {}

                      try {
                          if (pf.uri != null) getContentResolver().delete(pf.uri, null, null);
                          if (pf.file != null) pf.file.delete();
                      } catch (Exception ignored) {}
                  }


                  @JavascriptInterface
                  public void downloadUrl(String url, String filename, String mime) {
                      enqueueDownload(url, null, null, mime, filename);
                  }


                  @JavascriptInterface
                  public void toast(String message) {
                      MainActivity.this.toast(message);
                  }
              }


              private class DynamicColorJavascriptInterface {

                  @JavascriptInterface
                  public String getPalette() {
                      return buildPaletteJson();
                  }
              }


              /*
               * Resolve colors from the isolated dynamic Material
               * context rather than the Activity.
               */
              private int resolveColor(int attr, int fallback) {

                  return MaterialColors.getColor(
                      dynamicColorContext,
                      attr,
                      fallback
                  );
              }


              private String hex(int color) {

                  return String.format(
                      "#%06X",
                      0xFFFFFF & color
                  );
              }


              private String buildPaletteJson() {

                  int[][] palette = {

                      { R.attr.colorPrimary,                 0 },
                      { R.attr.colorOnPrimary,               0 },
                      { R.attr.colorPrimaryContainer,       0 },
                      { R.attr.colorOnPrimaryContainer,     0 },

                      { R.attr.colorSecondary,               0 },
                      { R.attr.colorOnSecondary,             0 },
                      { R.attr.colorSecondaryContainer,      0 },
                      { R.attr.colorOnSecondaryContainer,    0 },

                      { R.attr.colorTertiary,                 0 },
                      { R.attr.colorOnTertiary,               0 },
                      { R.attr.colorTertiaryContainer,       0 },
                      { R.attr.colorOnTertiaryContainer,     0 },

                      { R.attr.colorError,                    0 },
                      { R.attr.colorOnError,                  0 },
                      { R.attr.colorErrorContainer,           0 },
                      { R.attr.colorOnErrorContainer,         0 },

                      { R.attr.colorSurface,                  0 },
                      { R.attr.colorOnSurface,                0 },
                      { R.attr.colorSurfaceVariant,          0 },
                      { R.attr.colorOnSurfaceVariant,        0 },

                      { R.attr.colorSurfaceContainerLowest,   0 },
                      { R.attr.colorSurfaceContainerLow,     0 },
                      { R.attr.colorSurfaceContainer,         0 },
                      { R.attr.colorSurfaceContainerHigh,    0 },
                      { R.attr.colorSurfaceContainerHighest, 0 },

                      { R.attr.colorSurfaceDim,               0 },
                      { R.attr.colorSurfaceBright,            0 },

                      { R.attr.colorOutline,                  0 },
                      { R.attr.colorOutlineVariant,           0 }
                  };


                  String[] keys = {

                      "primary",
                      "onPrimary",
                      "primaryContainer",
                      "onPrimaryContainer",

                      "secondary",
                      "onSecondary",
                      "secondaryContainer",
                      "onSecondaryContainer",

                      "tertiary",
                      "onTertiary",
                      "tertiaryContainer",
                      "onTertiaryContainer",

                      "error",
                      "onError",
                      "errorContainer",
                      "onErrorContainer",

                      "surface",
                      "onSurface",
                      "surfaceVariant",
                      "onSurfaceVariant",

                      "surfaceContainerLowest",
                      "surfaceContainerLow",
                      "surfaceContainer",
                      "surfaceContainerHigh",
                      "surfaceContainerHighest",

                      "surfaceDim",
                      "surfaceBright",

                      "outline",
                      "outlineVariant"
                  };


                  StringBuilder sb =
                      new StringBuilder("{");


                  for (int i = 0; i < palette.length; i++) {

                      int color = resolveColor(
                          palette[i][0],
                          0xFF6750A4
                      );


                      sb.append("\"")
                        .append(keys[i])
                        .append("\":\"")
                        .append(hex(color))
                        .append("\"");


                      if (i < palette.length - 1) {
                          sb.append(",");
                      }
                  }


                  sb.append("}");

                  return sb.toString();
              }
          }
          JAVA_EOF


          echo "=========================================="
          echo "MainActivity.java patched"
          echo "=========================================="

          cat "$MAIN_ACTIVITY"


          # --------------------------------------------------------
          # 4. Create dynamic color JavaScript bridge
          #
          # Loaded in <head>, and pulls the palette directly from
          # the Android JavascriptInterface.
          # --------------------------------------------------------
          cat > www/dynamic-color-bridge.js << 'SCRIPT_EOF'
          (function () {

            function apply(palette) {
              if (!palette) return;

              window.__dynamicColors = palette;

              Object.entries(palette).forEach(function (entry) {
                document.documentElement.style.setProperty(
                  '--md-' + entry[0],
                  entry[1]
                );
              });

              document.documentElement.classList.add(
                'dynamic-colors-ready'
              );

              document.dispatchEvent(
                new CustomEvent('dynamic-colors-ready', {
                  detail: palette
                })
              );
            }


            function loadDynamicColors() {

              if (
                window.DynamicColorBridge &&
                typeof window.DynamicColorBridge.getPalette === 'function'
              ) {

                try {

                  var json =
                    window.DynamicColorBridge.getPalette();

                  if (json) {
                    apply(JSON.parse(json));
                    return true;
                  }

                } catch (error) {

                  console.error(
                    'Dynamic color bridge failed:',
                    error
                  );
                }
              }

              return false;
            }


            // Try immediately.
            if (!loadDynamicColors()) {

              // Defensive retry during WebView initialization.
              var attempts = 0;

              var timer = setInterval(function () {

                attempts++;

                if (
                  loadDynamicColors() ||
                  attempts >= 100
                ) {
                  clearInterval(timer);
                }

              }, 20);
            }

          })();
          SCRIPT_EOF


          # --------------------------------------------------------
          # 5. Inject dynamic color bridge into HEAD
          # --------------------------------------------------------
          if [ -f www/index.html ]; then

          sed -i \
          's#</head>#<script src="capacitor-download-bridge.js"></script><script src="dynamic-color-bridge.js"></script></head>#' \
                www/index.html

          else
            echo "ERROR: index.html not found."
            exit 1
          fi


      # ============================================================
      # STORAGE PERMISSION
      # ============================================================
      - name: Add storage permission
        run: |
          sed -i \
            '/<manifest /a\    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />' \
            android/app/src/main/AndroidManifest.xml


      # ============================================================
      # PREPARE APP ICON
      # ============================================================
      - name: Prepare app icon
        run: |

          if [ ! -f logo.png ]; then
            echo "ERROR: logo.png was not found in repository root."
            echo ""
            echo "Please add your finished HD app icon as:"
            echo "    logo.png"
            exit 1
          fi

          mkdir -p assets-icon

          cp logo.png assets-icon/logo.png

          echo "=========================================="
          echo "App icon:"
          echo "=========================================="

          file assets-icon/logo.png


      # ============================================================
      # INSTALL CAPACITOR ASSETS
      # ============================================================
      - name: Install Capacitor Assets
        run: |
          npm install --save-dev @capacitor/assets


      # ============================================================
      # GENERATE ANDROID ICONS
      # ============================================================
      - name: Generate Android icons
        run: |
          npx @capacitor/assets generate \
            --android \
            --assetPath assets-icon \
            --iconBackgroundColor "#FFFFFF" \
            --iconBackgroundColorDark "#111111"


      # ============================================================
      # SYNC CAPACITOR
      # ============================================================
      - name: Sync Android project
        run: |
          npx cap sync android


      # ============================================================
      # JAVA 21
      # ============================================================
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21


      # ============================================================
      # BUILD DEBUG APK
      # ============================================================
      - name: Build debug APK
        if: ${{ inputs.build_type == 'debug' }}
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug


      # ============================================================
      # BUILD RELEASE APK
      # ============================================================
      - name: Build release APK
        if: ${{ inputs.build_type == 'release' }}
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease


      # ============================================================
      # UPLOAD APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ inputs.build_type }}

          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk

          if-no-files-found: ignore
